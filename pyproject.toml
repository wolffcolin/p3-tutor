[project]
name = "p3-tutor"
version = "0.1.0"
description = "P3 for Coding with AI Agents: a tutoring agent that runs in Claude Code, and the bench that measures what each piece of it is worth."
requires-python = ">=3.11"
# Standard library only, so `python -m p3` works without uv as well as `uv run p3`.
dependencies = []

[project.scripts]
p3 = "p3.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["p3"]

[tool.ruff.lint]
# The course's lint rules for p3/ and tests/: errors, warnings, pyflakes and bugbear.
select = ["E", "F", "W", "B"]
ignore = ["E501", "B905"]
